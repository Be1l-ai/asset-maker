<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2D Web UI Asset</title>
  <style>
    html, body { margin: 0; width: 512px; height: 512px; background: transparent; display: grid; place-items: center; font-family: system-ui, sans-serif; }
    .badge { width: 420px; height: 420px; border-radius: 36px; background: linear-gradient(145deg, #1e293b, #0f172a); border: 4px solid #fbbf24; box-shadow: 0 22px 48px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.22); display: grid; place-items: center; color: #fef3c7; }
  </style>
</head>
<body>
  <div class="badge" id="Badge_Frame">
    <svg id="Emblem_Vector" width="220" height="220" viewBox="0 0 220 220" fill="none">
      <polygon points="110,18 194,110 110,202 26,110" fill="url(#g)" stroke="#fde68a" stroke-width="6"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs>
    </svg>
  </div>
</body>
</html>
